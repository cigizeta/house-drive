# House Drive's configuration, one file per machine, at %LOCALAPPDATA%\house-drive\config.toml.
# Every value below is a placeholder: the real file is written by `house-drive join` and never
# committed.

# Unique per machine: lowercase letters, digits and hyphens. Also the name of its journal folder.
machine_id = "machine-a"

# The tree this machine caches.
data_root = 'C:\example\data'

# The store's share; on the store machine, its local path.
store_root = '\\store-machine\house-drive'

# Written by `house-drive init-store`, checked at every run.
store_id = "00000000-0000-0000-0000-000000000000"

# Windows' ID of the home network, recorded by `house-drive join`.
home_network_id = "{00000000-0000-0000-0000-000000000000}"

# True on the store machine only.
is_store = false

# The rest are optional, shown with their defaults.
sync_minutes = 10
cache_limit_gb = 256
evict_to_percent = 90
trash_days = 30
# Files modified more recently than this wait for a later run, so files written in several
# sessions settle first.
settle_seconds = 60
# A push is split into batches of about this size; each batch reaches the store whole or not at all.
batch_mb = 1024

# Store machine only. One quota for the whole store, shared by every machine, counting its files
# and its trash; absent means no quota. Over it, new files wait on their machines; nothing is
# deleted to make room.
# store_quota_gb = 768
# Whatever the quota, merging stops accepting new files while the store's disk has less free.
free_margin_gb = 20
